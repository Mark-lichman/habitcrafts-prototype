<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HabitCrafts</title>
<meta name="description" content="HabitCrafts redesign prototype — the working app preview. Fixture data, in-session state, no backend.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/images/favicon.png">
<!-- Order matters: tokens → base → components. -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">

<body>

<!-- ===========================================================================
     THE APP SHELL.

     This file is the app. It is loaded inside index.html's device frame, but it
     is a complete page in its own right — open app.html directly and you get
     the app with no prototype scaffolding around it, which is what you want for
     a screenshot or a walkthrough.

     There is deliberately NO devbar here. The control bar lives one level up in
     index.html, outside the frame, because it is prototype scaffolding and must
     never be mistaken for product UI. app.html contains nothing that is not
     shipping design.

     Everything below the nav is rendered by js/router.js into <main>. This file
     holds only the three things that do not change between routes: the icon
     sprite, the skip link, and the nav.

     ES MODULES DO NOT LOAD OVER file://. Serve it:  node scripts/serve.js
     ======================================================================== -->

<!-- ===========================================================================
     ICON SPRITE — ONE FAMILY, ONE STYLE.  [D §6 "Iconography"]
     Hand-authored, outlined, fill-0, rounded terminals, 1.7px stroke on a
     24 × 24 grid, `currentColor` — so an icon is ink-muted at rest (the .icon
     base rule) and brand-600 when its parent is selected, with no per-icon CSS.

     THIS BLOCK IS CANONICAL AND BYTE-IDENTICAL ON EVERY PAGE. If you add an
     icon, add it here and paste the whole block to every page — never fork one
     page's copy. Zero raster, zero emoji-as-UI, zero mixed sharp/rounded/filled
     variants.

     Now that the app is one page, this block is loaded ONCE and every view's
     <use href="#i-…"> resolves against it. A view must never carry its own copy.
     ======================================================================== -->

<a class="skip-link" href="#main">Skip to today's habits</a>

<div class="app-shell" data-shell>

  <!-- =========================================================================
       NAVIGATION — floating bar &lt;600 · rail 600–1199 · drawer ≥1200
       The four-shape component, unchanged from the static screens except that
       every href is now a route and each item carries `data-nav`. The router
       moves `aria-current="page"` onto the item whose data-nav matches the
       view's `meta.nav`; nothing else about this markup is dynamic.

       Six destinations, four of them in the bottom bar. Explore and Library
       carry .nav-li--rail: below 600 the bar has room for four plus the FAB and
       no more, so they are hidden there and reached in-page. See components.css
       §E1.
       ====================================================================== -->
  <nav class="app-nav" aria-label="Primary" data-nav-root>
    <a class="app-nav__brand" href="#/home">
      <img src="assets/images/Habit_Craft_Logo_File-09.png" alt="">
      <span>HabitCrafts</span>
    </a>

    <a class="nav-fab" href="#/create">
      <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
      <span class="nav-fab__label">New habit</span>
      <span class="visually-hidden">Craft a new habit</span>
    </a>

    <ul class="app-nav__list">
      <li><a class="nav-item" href="#/home" data-nav="habits">
        <span class="nav-item__pill" aria-hidden="true"></span>
        <svg class="icon" aria-hidden="true"><use href="#i-habits"></use></svg>
        <span class="nav-item__label">Habits</span>
      </a></li>
      <li><a class="nav-item" href="#/progress" data-nav="progress">
        <span class="nav-item__pill" aria-hidden="true"></span>
        <svg class="icon" aria-hidden="true"><use href="#i-progress"></use></svg>
        <span class="nav-item__label">Progress</span>
      </a></li>
      <li><a class="nav-item" href="#/community" data-nav="community">
        <span class="nav-item__pill" aria-hidden="true"></span>
        <svg class="icon" aria-hidden="true"><use href="#i-community"></use></svg>
        <span class="nav-item__label">Community</span>
      </a></li>
      <li class="nav-li--rail"><a class="nav-item" href="#/explore" data-nav="explore">
        <span class="nav-item__pill" aria-hidden="true"></span>
        <svg class="icon" aria-hidden="true"><use href="#i-explore"></use></svg>
        <span class="nav-item__label">Explore</span>
      </a></li>
      <li class="nav-li--rail"><a class="nav-item" href="#/library" data-nav="library">
        <span class="nav-item__pill" aria-hidden="true"></span>
        <svg class="icon" aria-hidden="true"><use href="#i-library"></use></svg>
        <span class="nav-item__label">Library</span>
      </a></li>
      <li><a class="nav-item" href="#/profile" data-nav="profile">
        <span class="nav-item__pill" aria-hidden="true"></span>
        <svg class="icon" aria-hidden="true"><use href="#i-person"></use></svg>
        <span class="nav-item__label">Profile</span>
      </a></li>
    </ul>

    <a class="app-nav__user" href="#/profile">
      <span class="avatar" aria-hidden="true" data-user-initial>M</span>
      <span>
        <span class="t-label" style="display:block" data-user-name>Mark</span>
        <span class="t-body-sm t-muted" data-user-since>Member since 2024</span>
      </span>
    </a>
  </nav>

  <!-- =========================================================================
       THE VIEW STACK. The router appends one `.view` element here per route and
       keeps two of them alive for the length of a transition. Everything inside
       is owned by the current view; nothing outside a view may write into it.
       ====================================================================== -->
  <main id="main" class="view-stack" data-view-root></main>
</div>

<!-- The behaviour layer FIRST, as a classic script: it must have published
     window.HC before the module below starts routing. It self-boots on
     DOMContentLoaded and js/app.js waits for the same event, and handlers run
     in registration order, so HC is fully booted before the first render. -->
<script src="js/prototype.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
