<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HabitCrafts — prototype</title>
<meta name="description" content="The HabitCrafts prototype harness: the working app preview in a resizable device frame, with theme, motion and hour controls.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/images/favicon.png">
<!-- Order matters: tokens → base → components. The harness loads them only so
     it can consume the semantic --c-* layer; it uses no component classes. -->
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<style>
/* ===========================================================================
   HARNESS-ONLY SCAFFOLDING. This page has its own <style> block for the same
   reason the gallery does: none of it is product, and no screen may copy it.

   THE BAR IS DELIBERATELY UNDESIGNED. It is prototype scaffolding wrapped
   around the app, and if it looked like a designed surface someone would
   eventually review it as one. So: system-ui, not Figtree. Square corners, not
   radius-16. A flat sunken strip, no shadow, no hero, no gold. It should read
   as a browser toolbar, not as HabitCrafts.

   It still keeps the two rules that are about correctness rather than taste —
   every colour comes from the semantic --c-* layer (there is not one literal
   hex in this file, so the bar re-tones in Nightfall along with the app), and
   the 13px text floor holds.
   ======================================================================== */

html, body { block-size: 100%; }
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  background: var(--c-canvas-sunken);
  overflow: hidden;                 /* the iframe scrolls, the harness does not */
}

/* ---- The control bar ---------------------------------------------------- */
.hz-bar {
  flex: none;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-16);
  padding: var(--space-8) var(--space-12);
  background: var(--c-surface);
  border-block-end: var(--stroke-hairline) solid var(--c-border);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 13px;
  color: var(--c-ink);
}

.hz-group { display: flex; align-items: center; gap: var(--space-4); }

.hz-legend {
  color: var(--c-ink-subtle);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-size: 13px;
  margin-inline-end: var(--space-4);
}

.hz-btn {
  min-block-size: 30px;
  padding: 2px var(--space-8);
  font: inherit;
  color: var(--c-ink-muted);
  background: var(--c-canvas-sunken);
  border: var(--stroke-hairline) solid var(--c-border);
  border-radius: 4px;               /* square-ish on purpose. Not radius-sm. */
  cursor: pointer;
}
.hz-btn:hover { color: var(--c-ink); }
.hz-btn[aria-pressed="true"] {
  background: var(--c-ink-strong);
  border-color: var(--c-ink-strong);
  color: var(--c-canvas);
}

.hz-bar input[type="range"] { inline-size: 96px; accent-color: var(--c-ink-strong); }
.hz-read {
  font-variant-numeric: tabular-nums;
  color: var(--c-ink-muted);
  min-inline-size: 44px;
}

.hz-spacer { flex: 1 1 auto; }
.hz-link { color: var(--c-ink-muted); text-decoration: underline; }
.hz-link:hover { color: var(--c-ink); }

/* ---- The device frame ---------------------------------------------------
   The app runs in an IFRAME, and that is not a detail — CSS media queries
   respond to the VIEWPORT, not to a container, so shrinking a div would leave
   the app rendering at desktop breakpoints inside a phone-shaped box. An
   iframe has its own viewport, so 390px here genuinely triggers the mobile
   bar-shaped nav, the same as a phone would.
------------------------------------------------------------------------- */
.hz-stage {
  flex: 1 1 auto;
  min-block-size: 0;
  display: flex;
  /* `safe center` so that when the selected width is wider than the window the
     frame overflows to the RIGHT and the stage scrolls to it, instead of being
     centred with its left edge clipped past the scroll origin. */
  justify-content: safe center;
  padding: var(--space-16);
  overflow: auto;
}

.hz-frame {
  /* content-box is LOAD-BEARING. The reset sets border-box globally, which
     would make `inline-size: 390px` mean 390px INCLUDING the hairline border —
     giving the app a 388px viewport. The whole point of the switcher is that
     390 means 390, so the border has to sit outside the measurement. */
  box-sizing: content-box;
  block-size: 100%;
  inline-size: 100%;
  /* flex:none is the other half of the stage's `overflow:auto` + `safe center`.
     As a flex item the frame defaults to flex-shrink:1, so a 1280px selection
     in a 1300px window silently shrank to ~1231 — the switcher quietly lying
     about the width it claimed to be showing. Refusing to shrink makes it
     overflow and the stage scroll to it, so 1280 means 1280 at any window. */
  flex: none;
  border: var(--stroke-hairline) solid var(--c-border);
  background: var(--c-canvas);
  display: block;
}
.hz-build {
  color: var(--c-ink-muted);
  font-size: var(--fs-label);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* Full width means edge to edge: no frame padding, no border to measure past. */
.hz-stage[data-size="full"] { padding: 0; }
.hz-stage[data-size="full"] .hz-frame { border: 0; }

@media (max-width: 599px) {
  .hz-bar { gap: var(--space-8); padding: var(--space-8); }
  .hz-legend { display: none; }
  .hz-stage { padding: 0; }
}
</style>
</head>
<body>

<!-- ===========================================================================
     THE PROTOTYPE HARNESS.

     index.html used to be the design-system gallery; that moved to system.html
     unchanged, and this is now the thing you open first: the working app in a
     resizable frame with the review controls around it.

     WHAT IS SCAFFOLDING AND WHAT IS PRODUCT
       · everything on this page  — scaffolding. Deletes with the Flutter
         migration and never ships.
       · everything inside the frame (app.html) — product. It carries no devbar
         of its own, so a screenshot of the frame is a screenshot of the app.

     ES MODULES DO NOT LOAD OVER file://. This will not work by double-click.
     Serve it:   node scripts/serve.js   →   http://localhost:5173
     ======================================================================== -->

<h1 class="visually-hidden">HabitCrafts prototype harness</h1>

<div class="hz-bar" role="group" aria-label="Prototype controls">

  <!-- Viewport. The reason the app is in an iframe at all. -->
  <div class="hz-group" role="group" aria-label="Viewport">
    <span class="hz-legend" aria-hidden="true">Viewport</span>
    <button class="hz-btn" type="button" data-size="390"  aria-pressed="false">Mobile 390</button>
    <button class="hz-btn" type="button" data-size="768"  aria-pressed="false">Tablet 768</button>
    <button class="hz-btn" type="button" data-size="1280" aria-pressed="false">Desktop 1280</button>
    <button class="hz-btn" type="button" data-size="full" aria-pressed="true">Full width</button>
  </div>

  <div class="hz-group" role="group" aria-label="Theme">
    <span class="hz-legend" aria-hidden="true">Theme</span>
    <button class="hz-btn" type="button" data-theme-set="system" aria-pressed="true">Auto</button>
    <button class="hz-btn" type="button" data-theme-set="light"  aria-pressed="false">Light</button>
    <button class="hz-btn" type="button" data-theme-set="dark"   aria-pressed="false">Dark</button>
  </div>

  <div class="hz-group" role="group" aria-label="Motion">
    <span class="hz-legend" aria-hidden="true">Motion</span>
    <button class="hz-btn" type="button" data-motion-set="auto"   aria-pressed="true">Auto</button>
    <button class="hz-btn" type="button" data-motion-set="reduce" aria-pressed="false">Reduce</button>
  </div>

  <!-- Hour simulation, so the after-20:00 hero and the evening greeting can be
       seen without waiting until 8pm. [D §2.5] -->
  <div class="hz-group">
    <label class="hz-legend" for="hz-hour">Hour</label>
    <input id="hz-hour" type="range" min="0" max="23" step="1" data-hour>
    <output class="hz-read" data-hour-read>—</output>
  </div>

  <span class="hz-spacer"></span>

  <button class="hz-btn" type="button" data-reset>Reset data</button>
  <a class="hz-link" href="system.html">Design system →</a>
  <!-- Which build am I looking at? GitHub Pages sets its own cache headers, so a
       returning visitor can be served a stale build with no signal that is what
       happened. build.json is written by the deploy workflow; absent locally. -->
  <span class="hz-build" data-build title="Deployed build">local</span>
</div>

<div class="hz-stage" data-stage data-size="full">
  <iframe class="hz-frame" src="app.html#/home" title="HabitCrafts app preview" data-frame></iframe>
</div>

<script>
/* ===========================================================================
   THE HARNESS CONTROLLER.

   Same-origin iframe, so the bar reaches straight into `contentWindow` and
   calls the app's own public API rather than inventing a message protocol:
   HC for theme / motion / hour (it already owns the <html> attributes and the
   persistence), HCApp for the store. postMessage would buy nothing here and
   would need both halves kept in sync.

   Same-origin is also why this needs the local server. Over file:// the modules
   would not load and this access would be blocked as well.
   ======================================================================== */
(function () {
  'use strict';

  var root = document.documentElement;
  var stage = document.querySelector('[data-stage]');
  var frame = document.querySelector('[data-frame]');
  var hourInput = document.querySelector('[data-hour]');
  var hourRead = document.querySelector('[data-hour-read]');

  /* The harness's own settings, re-applied to the app whenever it reloads. */
  var settings = {
    theme: 'system',
    motion: 'auto',
    hour: new Date().getHours(),
    size: 'full',
  };

  function press(selector, attr, value) {
    document.querySelectorAll(selector).forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute(attr) === value));
    });
  }

  /** The app's window, or null while it is still loading. */
  function app() {
    try { return frame.contentWindow; } catch (e) { return null; }
  }

  /* --- Viewport ----------------------------------------------------------
     Only the WIDTH changes. The iframe is never reloaded, so the app keeps its
     route and its state while you step 390 → 768 → 1280 and watch the nav
     change shape underneath it. */
  function setSize(size) {
    settings.size = size;
    stage.setAttribute('data-size', size);
    frame.style.inlineSize = size === 'full' ? '100%' : size + 'px';
    press('[data-size]', 'data-size', size);
  }

  /* --- Theme / motion / hour ---------------------------------------------
     Applied to the app AND to the harness itself: a white toolbar strapped to
     a dark app is unreadable, and the bar has to be legible to be used. */
  function apply() {
    var w = app();
    if (settings.theme === 'system') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', settings.theme);

    if (!w || !w.HC) return;
    w.HC.setTheme(settings.theme);
    w.HC.setMotion(settings.motion);
    w.HC.setHour(settings.hour);
  }

  function setTheme(mode) {
    settings.theme = mode;
    press('[data-theme-set]', 'data-theme-set', mode);
    apply();
  }

  function setMotion(mode) {
    settings.motion = mode;
    press('[data-motion-set]', 'data-motion-set', mode);
    apply();
  }

  function setHour(h) {
    settings.hour = Math.max(0, Math.min(23, parseInt(h, 10) || 0));
    hourInput.value = settings.hour;
    hourRead.textContent = (settings.hour < 10 ? '0' : '') + settings.hour + ':00';
    apply();
  }

  /* --- Wiring ------------------------------------------------------------ */
  document.querySelectorAll('[data-size]').forEach(function (b) {
    if (b.tagName !== 'BUTTON') return;
    b.addEventListener('click', function () { setSize(b.getAttribute('data-size')); });
  });
  document.querySelectorAll('[data-theme-set]').forEach(function (b) {
    b.addEventListener('click', function () { setTheme(b.getAttribute('data-theme-set')); });
  });
  document.querySelectorAll('[data-motion-set]').forEach(function (b) {
    b.addEventListener('click', function () { setMotion(b.getAttribute('data-motion-set')); });
  });
  hourInput.addEventListener('input', function () { setHour(hourInput.value); });

  /* Reset data: back to the fixtures, same route, no reload — so you can watch
     the habits you just completed come back un-checked. */
  document.querySelector('[data-reset]').addEventListener('click', function () {
    var w = app();
    if (w && w.HCApp) w.HCApp.reset();
    else if (w) w.location.reload();
  });

  /* The app is reloadable from inside the frame (a hard refresh, a bad hash).
     Re-apply on every load or the theme silently reverts. */
  frame.addEventListener('load', apply);

  setSize('full');
  setHour(settings.hour);

  /* Build stamp. build.json only exists on a deployed site (the workflow writes
     it), so a 404 here means you are on a local server — which is the truth we
     want to show, not an error. Cache-busted so the stamp itself can never be
     the stale thing reporting staleness. */
  (function stamp() {
    var el = document.querySelector('[data-build]');
    if (!el) return;
    fetch('build.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (b) {
        if (!b) return;
        var when = new Date(b.time);
        el.textContent = b.sha + ' · ' + when.toISOString().slice(0, 16).replace('T', ' ') + 'Z';
        el.title = 'Deployed ' + when.toLocaleString() + ' from ' + b.ref;
      })
      .catch(function () { /* local: the default "local" text already says so */ });
  })();
})();
</script>
</body>
</html>
