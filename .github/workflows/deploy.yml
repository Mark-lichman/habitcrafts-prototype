name: Deploy prototype to GitHub Pages

# The prototype is plain static HTML with no build step and no dependencies,
# so this just uploads the prototype/ directory as-is.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Don't cancel a run in progress — let it finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check the prototype before publishing
        run: |
          set -euo pipefail
          test -f prototype/index.html || { echo "::error::prototype/index.html is missing"; exit 1; }
          fail=0

          # Every screen the gallery links to must actually exist on disk.
          for f in $(grep -ohE 'href="[a-z0-9-]+\.html"' prototype/*.html \
                     | sed -E 's/href="([^"]+)"/\1/' | sort -u); do
            if [ ! -f "prototype/$f" ]; then echo "::error::broken link target: $f"; fail=1; fi
          done

          # Only prototype/ is published, so a reference that resolves ABOVE it is
          # broken once deployed even though it works locally. A `../` is not
          # itself the problem — js/views/*.js legitimately import `../store.js`,
          # which lands on prototype/js/store.js. So resolve each reference
          # relative to the file that makes it and check where it actually ends up.
          node -e '
            const fs = require("fs"), path = require("path");
            const ROOT = path.resolve("prototype");
            let bad = 0;
            const walk = (d) => fs.readdirSync(d, { withFileTypes: true }).flatMap((e) => {
              const p = path.join(d, e.name);
              return e.isDirectory() ? walk(p) : [p];
            });
            for (const file of walk(ROOT)) {
              if (!/\.(html|css|js)$/.test(file)) continue;
              const src = fs.readFileSync(file, "utf8");
              const refs = [
                ...src.matchAll(/(?:src|href)="([^"]*\.\.\/[^"]*)"/g),
                ...src.matchAll(/(?:import|from)\s*\(?\s*["'"'"']([^"'"'"']*\.\.\/[^"'"'"']*)["'"'"']/g),
                ...src.matchAll(/url\(\s*["'"'"']?([^)"'"'"']*\.\.\/[^)"'"'"']*)["'"'"']?\s*\)/g),
              ].map((m) => m[1]);
              for (const ref of refs) {
                const target = path.resolve(path.dirname(file), ref.split(/[?#]/)[0]);
                if (!target.startsWith(ROOT + path.sep)) {
                  console.log(`::error file=${path.relative(".", file)}::reference escapes the published root: ${ref}`);
                  bad = 1;
                } else if (!fs.existsSync(target)) {
                  console.log(`::error file=${path.relative(".", file)}::unresolved reference: ${ref}`);
                  bad = 1;
                }
              }
            }
            process.exit(bad);
          ' || fail=1

          # Local asset references must resolve.
          for a in $(grep -rhoE '(src|href)="(assets/[^"]+)"' prototype --include='*.html' \
                     | sed -E 's/.*="([^"]+)"/\1/' | sort -u); do
            if [ ! -f "prototype/$a" ]; then echo "::error::missing asset: $a"; fail=1; fi
          done

          exit $fail

      - name: Stamp the build
        # GitHub Pages sets its own cache headers, so a returning visitor can be
        # served an old build silently. The harness reads this and shows it.
        run: |
          printf '{"sha":"%s","time":"%s","ref":"%s"}\n' \
            "$(git rev-parse --short HEAD)" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${GITHUB_REF_NAME}" > prototype/build.json
          cat prototype/build.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype

      - id: deployment
        uses: actions/deploy-pages@v4
